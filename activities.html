<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环保活动 - 校园环保网</title>
    <link rel="stylesheet" href="css/style.css?v=20261026b">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🌿</span>
                <span>校园环保网</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="activities.html" class="active">环保活动</a></li>
                <li><a href="feed.html">环保动态</a></li>
                <li><a href="carbon.html">碳足迹</a></li>
                <li><a href="shop.html">积分商城</a></li>
            </ul>
            <div class="nav-user" id="navUser"></div>
        </div>
    </nav>

    <div class="page-banner">
        <h1>🌳 校园环保活动</h1>
        <p>参与环保活动，为绿色校园贡献力量！</p>
    </div>

    <div class="container">
        <!-- 管理员发布/编辑活动 -->
        <div id="adminPublishSection" style="display:none;margin-bottom:24px;">
            <div class="panel">
                <h2 id="publishTitle" style="font-size:18px;font-weight:700;margin-bottom:16px;">📢 发布新活动</h2>
                <input type="hidden" id="actEditId" value="">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                    <div class="form-group">
                        <label>活动标题</label>
                        <input type="text" id="actTitle" placeholder="如：植树节绿化活动">
                    </div>
                    <div class="form-group">
                        <label>图标 emoji</label>
                        <input type="text" id="actEmoji" placeholder="如：🌳" maxlength="2" value="🌱">
                    </div>
                    <div class="form-group">
                        <label>地点</label>
                        <input type="text" id="actPlace" placeholder="如：学生活动中心">
                    </div>
                    <div class="form-group">
                        <label>时间</label>
                        <input type="text" id="actTime" placeholder="如：11/02 08:00">
                    </div>
                    <div class="form-group" style="grid-column:1/-1;">
                        <label>活动描述</label>
                        <input type="text" id="actDesc" placeholder="活动简介">
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select id="actStatus" style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;">
                            <option value="报名中">报名中</option>
                            <option value="候补中">候补中</option>
                            <option value="已结束">已结束</option>
                        </select>
                    </div>
                </div>
                <div style="display:flex;gap:10px;">
                    <button class="btn btn-primary" onclick="publishActivity()">保存活动</button>
                    <button class="btn btn-outline" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">取消编辑</button>
                </div>
            </div>
        </div>

        <div class="filter-row">
            <button class="filter-btn active" onclick="filterActivities('全部')">全部</button>
            <button class="filter-btn" onclick="filterActivities('报名中')">报名中</button>
            <button class="filter-btn" onclick="filterActivities('候补中')">候补中</button>
            <button class="filter-btn" onclick="filterActivities('已结束')">已结束</button>
        </div>
        <div id="activityList"></div>
    </div>

    <!-- 报名弹窗 -->
    <div class="modal-overlay" id="signupModal">
        <div class="modal">
            <h3>报名活动</h3>
            <p style="color:var(--text-muted);margin-bottom:14px;" id="signupActivityTitle"></p>
            <input type="hidden" id="signupActivityId">
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="signupName" placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label>班级</label>
                <input type="text" id="signupClass" placeholder="如：环境2101班">
            </div>
            <div class="form-group">
                <label>学号</label>
                <input type="text" id="signupStudentId" placeholder="请输入学号">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="document.getElementById('signupModal').classList.remove('open')">取消</button>
                <button class="btn btn-primary" onclick="confirmSignup()">确认报名</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom">© 2024 校园环保网 · 让绿色成为校园最亮丽的底色 🌍</div>
    </footer>

    <script src="js/eco.js?v=20261026b"></script>
    <script src="js/auth.js?v=20261026b"></script>
    <script src="js/main.js?v=20261026b"></script>
    <script>
        // 管理员可见发布区
        if (isAdmin()) {
            document.getElementById("adminPublishSection").style.display = "block";
        }

        function publishActivity() {
            const title = document.getElementById("actTitle").value.trim();
            const emoji = document.getElementById("actEmoji").value.trim() || "🌱";
            const place = document.getElementById("actPlace").value.trim();
            const time = document.getElementById("actTime").value.trim();
            const desc = document.getElementById("actDesc").value.trim();
            const status = document.getElementById("actStatus").value;
            const editId = document.getElementById("actEditId").value;

            if (!title || !place || !time) {
                showToast("请填写活动标题、地点和时间");
                return;
            }

            const activities = getActivities();
            if (editId) {
                // 编辑模式
                const idx = activities.findIndex(a => a.id === editId);
                if (idx !== -1) {
                    activities[idx] = { ...activities[idx], title, emoji, place, time, desc, status };
                    showToast("活动修改成功！", "success");
                }
            } else {
                // 新建
                activities.unshift({
                    id: "e" + Date.now(),
                    title, emoji, place, time, desc, status
                });
                showToast("活动发布成功！", "success");
            }
            saveActivities(activities);
            clearForm();
            renderActivities();
        }

        function editActivity(id) {
            const act = getActivities().find(a => a.id === id);
            if (!act) return;
            document.getElementById("actEditId").value = id;
            document.getElementById("actTitle").value = act.title;
            document.getElementById("actEmoji").value = act.emoji;
            document.getElementById("actPlace").value = act.place;
            document.getElementById("actTime").value = act.time;
            document.getElementById("actDesc").value = act.desc || "";
            document.getElementById("actStatus").value = act.status;
            document.getElementById("publishTitle").textContent = "✏️ 编辑活动";
            document.getElementById("cancelEditBtn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function cancelEdit() {
            clearForm();
        }

        function clearForm() {
            document.getElementById("actEditId").value = "";
            document.getElementById("actTitle").value = "";
            document.getElementById("actEmoji").value = "🌱";
            document.getElementById("actPlace").value = "";
            document.getElementById("actTime").value = "";
            document.getElementById("actDesc").value = "";
            document.getElementById("actStatus").value = "报名中";
            document.getElementById("publishTitle").textContent = "📢 发布新活动";
            document.getElementById("cancelEditBtn").style.display = "none";
        }

        function deleteActivity(id) {
            if (!confirm("确定删除该活动吗？相关报名记录也会被移除。")) return;
            let activities = getActivities().filter(a => a.id !== id);
            saveActivities(activities);
            // 同时删除相关报名
            const signups = getSignups().filter(s => s.activityId !== id);
            saveSignups(signups);
            showToast("活动已删除", "success");
            renderActivities();
        }
    </script>
</body>
</html>
