<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环保咨询 - 校园环保网</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .consult-search { display: flex; gap: 10px; margin-bottom: 18px; }
        .consult-search input { flex: 1; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; }
        .consult-search input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
        .site-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
        .site-card { background: #fff; border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px; transition: var(--transition); }
        .site-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .site-head { display: flex; align-items: center; gap: 10px; }
        .site-logo { width: 38px; height: 38px; border-radius: 10px; background: var(--emerald-100); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .site-name { font-weight: 600; font-size: 15px; }
        .site-tag { font-size: 11px; color: var(--emerald-700); background: var(--emerald-50); padding: 2px 8px; border-radius: 20px; }
        .site-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; flex: 1; }
        .site-url { font-size: 12px; color: var(--text-muted); word-break: break-all; }
        .site-card .btn { align-self: flex-start; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🌿</span>
                <span>校园环保网</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="activities.html">环保活动</a></li>
                <li><a href="feed.html">环保动态</a></li>
                <li><a href="consult.html" class="active">环保咨询</a></li>
                <li><a href="carbon.html">碳足迹</a></li>
                <li><a href="shop.html">积分商城</a></li>
            </ul>
            <div class="nav-user" id="navUser"></div>
        </div>
    </nav>

    <div class="page-banner">
        <h1>🔎 环保咨询窗口</h1>
        <p>权威环保机构与公益组织官网，一键直达</p>
    </div>

    <div class="container">
        <div class="consult-search">
            <input type="text" id="searchInput" placeholder="搜索机构名称或关键词，如：生态环境部、大气、气候..." oninput="renderSites()">
        </div>
        <div class="filter-row">
            <button class="filter-btn active" onclick="setCategory('全部', this)">全部</button>
            <button class="filter-btn" onclick="setCategory('政府机构', this)">政府机构</button>
            <button class="filter-btn" onclick="setCategory('国际组织', this)">国际组织</button>
            <button class="filter-btn" onclick="setCategory('公益组织', this)">公益组织</button>
        </div>
        <div class="site-grid" id="siteGrid"></div>
    </div>

    <footer class="footer">
        <div class="footer-bottom">© 2024 校园环保网 · 让绿色成为校园最亮丽的底色 🌍</div>
    </footer>

    <script src="js/eco.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        const SITES = [
            {
                name: "中华人民共和国生态环境部",
                url: "https://www.mee.gov.cn",
                emoji: "🏛️",
                category: "政府机构",
                desc: "国家生态环境保护主管部门，发布环保政策、法规、空气质量与环保资讯。"
            },
            {
                name: "中国环境网（中国环境报）",
                url: "https://www.cenews.com.cn",
                emoji: "📰",
                category: "政府机构",
                desc: "生态环境领域权威媒体，报道环保新闻、政策解读与典型案例。"
            },
            {
                name: "自然资源部",
                url: "https://www.mnr.gov.cn",
                emoji: "🗺️",
                category: "政府机构",
                desc: "负责自然资源调查监测、国土空间规划与生态保护修复。"
            },
            {
                name: "国家林业和草原局",
                url: "https://www.forestry.gov.cn",
                emoji: "🌲",
                category: "政府机构",
                desc: "主管森林、草原、湿地资源保护，可查询植树造林与生态修复动态。"
            },
            {
                name: "中国环境科学学会",
                url: "https://www.chinacses.org",
                emoji: "🔬",
                category: "政府机构",
                desc: "环境科技工作者组成的学术团体，提供学术交流、科普与成果信息。"
            },
            {
                name: "联合国环境规划署（UNEP）",
                url: "https://www.unep.org/zh-hans",
                emoji: "🌍",
                category: "国际组织",
                desc: "联合国环境事务牵头机构，发布全球环境评估报告与气候行动倡议。"
            },
            {
                name: "联合国气候变化框架公约（UNFCCC）",
                url: "https://unfccc.int",
                emoji: "🌡️",
                category: "国际组织",
                desc: "《巴黎协定》与历届气候大会（COP）官方信息发布平台。"
            },
            {
                name: "世界资源研究所（WRI）中国",
                url: "https://wri.org.cn",
                emoji: "📊",
                category: "国际组织",
                desc: "提供城市、能源、气候与可持续交通领域的研究报告与数据。"
            },
            {
                name: "世界自然基金会（WWF）中国",
                url: "https://www.wwfchina.org",
                emoji: "🐼",
                category: "公益组织",
                desc: "全球性自然保护组织，开展物种保护、森林与气候项目，有丰富的科普内容。"
            },
            {
                name: "绿色和平（中国）",
                url: "https://www.greenpeace.org.cn",
                emoji: "🌱",
                category: "公益组织",
                desc: "国际环保公益组织，关注气候变化、能源转型与生态保护议题。"
            },
            {
                name: "中国生物多样性保护与绿色发展基金会",
                url: "https://www.cbcgdf.org",
                emoji: "🦋",
                category: "公益组织",
                desc: "专注生物多样性保护与绿色发展，发布公益项目与生态科普内容。"
            },
            {
                name: "中国环境监测总站",
                url: "https://www.cnemc.cn",
                emoji: "💧",
                category: "政府机构",
                desc: "发布全国空气质量、水质等环境监测数据与技术规范。"
            }
        ];

        let currentCategory = "全部";

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderSites();
        }

        function renderSites() {
            const kw = (document.getElementById("searchInput").value || "").trim().toLowerCase();
            const list = SITES.filter(s => {
                const matchCat = currentCategory === "全部" || s.category === currentCategory;
                const matchKw = !kw || s.name.toLowerCase().includes(kw) || s.desc.toLowerCase().includes(kw) || s.url.toLowerCase().includes(kw);
                return matchCat && matchKw;
            });
            const el = document.getElementById("siteGrid");
            if (list.length === 0) {
                el.innerHTML = `<div class="empty-state"><p>没有找到相关网站，换个关键词试试</p></div>`;
                return;
            }
            el.innerHTML = list.map(s => `
                <div class="site-card">
                    <div class="site-head">
                        <div class="site-logo">${s.emoji}</div>
                        <div>
                            <div class="site-name">${s.name}</div>
                            <span class="site-tag">${s.category}</span>
                        </div>
                    </div>
                    <p class="site-desc">${s.desc}</p>
                    <p class="site-url">${s.url}</p>
                    <a class="btn btn-primary" href="${s.url}" target="_blank" rel="noopener noreferrer">访问官网 →</a>
                </div>
            `).join("");
        }

        renderSites();
    </script>
</body>
</html>
