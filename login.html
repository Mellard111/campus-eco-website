<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园环保网</title>
    <link rel="stylesheet" href="css/style.css?v=20261026b">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🌿</span>
                <span>校园环保网</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="activities.html">环保活动</a></li>
            </ul>
            <div class="nav-user" id="navUser"></div>
        </div>
    </nav>

    <section class="auth-wrap">
        <div class="auth-card">
            <h2>🌿 欢迎回来</h2>
            <p class="auth-sub">登录账号，继续你的环保之旅</p>
            <div class="auth-msg error" id="errorMsg"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary">登 录</button>
            </form>
            <p class="auth-switch">还没有账号？<a href="register.html">立即注册</a></p>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-bottom">© 2024 校园环保网 · 让绿色成为校园最亮丽的底色 🌍</div>
    </footer>

    <script src="js/eco.js?v=20261026b"></script>
    <script src="js/auth.js?v=20261026b"></script>
    <script>
        function showMsg(msg, isError) {
            const el = document.getElementById("errorMsg");
            el.textContent = msg;
            el.className = "auth-msg " + (isError ? "error" : "success");
            el.style.display = "block";
        }
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const result = loginUser(username, password);
            if (result.success) {
                showMsg("登录成功，正在跳转...", false);
                setTimeout(() => { window.location.href = "profile.html"; }, 800);
            } else {
                showMsg(result.message, true);
            }
        }
        if (isLoggedIn()) window.location.href = "profile.html";
    </script>
</body>
</html>
