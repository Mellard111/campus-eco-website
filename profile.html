<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 校园环保网</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🌿</span>
                <span>校园环保网</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="activities.html">环保活动</a></li>
                <li><a href="feed.html">环保动态</a></li>
                <li><a href="carbon.html">碳足迹</a></li>
                <li><a href="shop.html">积分商城</a></li>
            </ul>
            <div class="nav-user" id="navUser"></div>
        </div>
    </nav>

    <div class="container" id="profileContent"></div>

    <!-- 修改资料弹窗 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>修改资料</h3>
            <div class="form-group">
                <label for="editEmail">邮箱</label>
                <input type="email" id="editEmail" placeholder="新邮箱">
            </div>
            <div class="form-group">
                <label for="editStudentId">学号</label>
                <input type="text" id="editStudentId" placeholder="请输入学号">
            </div>
            <div class="form-group">
                <label for="editCollege">学院</label>
                <select id="editCollege"></select>
            </div>
            <div class="form-group">
                <label for="editClassName">班级</label>
                <input type="text" id="editClassName" placeholder="班级">
            </div>
            <div class="form-group">
                <label for="editPassword">新密码（留空则不修改）</label>
                <input type="password" id="editPassword" placeholder="至少6个字符">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="hideEditModal()">取消</button>
                <button class="btn btn-primary" onclick="saveProfile()">保存</button>
            </div>
        </div>
    </div>

    <!-- 打卡弹窗 -->
    <div class="modal-overlay" id="checkinModal">
        <div class="modal">
            <h3>低碳打卡</h3>
            <div id="checkinModalBody"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeCheckin()">取消</button>
                <button class="btn btn-primary" onclick="confirmCheckin()">确认打卡</button>
            </div>
        </div>
    </div>

    <!-- 凭证预览弹窗 -->
    <div class="modal-overlay" id="proofModal">
        <div class="modal" style="max-width:600px;">
            <h3 id="proofTitle">打卡凭证</h3>
            <div id="proofPreview" style="text-align:center;"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="document.getElementById('proofModal').classList.remove('open')">关闭</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom">© 2024 校园环保网 · 让绿色成为校园最亮丽的底色 🌍</div>
    </footer>

    <script src="js/eco.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        const proofCache = {};

        function renderProfile() {
            const user = getCurrentUser();
            if (!user) { window.location.href = "login.html"; return; }

            const data = getUserEcoData(user.id);
            const summary = getEcoSummary(user.id);
            const days = lastDays(28);
            const checked = new Set(data.checkedInDates);

            const entriesHtml = data.entries.length === 0
                ? `<div class="empty-state">
                    <p>今天还没有打卡，去试试自带水杯</p>
                    <button class="btn btn-primary" onclick="openCheckin('cup')">去打卡</button>
                   </div>`
                : `<ul class="entry-list">
                    ${data.entries.slice(0, 50).map(e => {
                        const statusBadge = e.status === "approved" 
                            ? '<span style="color:var(--emerald-700);font-size:12px;">✓ 已通过</span>'
                            : e.status === "rejected"
                            ? '<span style="color:#ef4444;font-size:12px;">✗ 已拒绝</span>'
                            : '<span style="color:#f59e0b;font-size:12px;">⏳ 审核中</span>';
                        let proofIcon = '';
                        if (e.proof) {
                            const cacheKey = "p_" + e.id;
                            proofCache[cacheKey] = e.proof;
                            proofIcon = `<span style="cursor:pointer;" onclick="viewProof('${cacheKey}')" title="查看凭证">📎</span>`;
                        }
                        return `
                        <li class="entry-item">
                            <div class="entry-info">
                                <p>${e.title} ${proofIcon} ${statusBadge}</p>
                                <span class="meta">${formatDateTime(e.createdAt)}${e.detail ? ' · ' + e.detail : ''}</span>
                            </div>
                            <span class="entry-points ${e.points >= 0 ? 'plus' : 'minus'}">${e.status === 'approved' ? (e.points >= 0 ? '+' + e.points : e.points) : '—'}</span>
                        </li>
                        `;
                    }).join("")}
                   </ul>`;

            document.getElementById("profileContent").innerHTML = `
                <!-- 用户信息 -->
                <div class="profile-header">
                    <div class="profile-avatar-lg">${user.username.charAt(0).toUpperCase()}</div>
                    <div class="profile-meta">
                        <h2>${user.username} ${user.role === 'admin' ? '<span style="background:#f59e0b;color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;margin-left:6px;">管理员</span>' : ''}</h2>
                        <p class="email">${user.email}</p>
                        <p style="margin-top:4px;font-size:13px;color:var(--text-muted);">
                            🎓 ${user.college || '未填写'} · ${user.className || '未填写'} · 学号 ${user.studentId || '未填写'}
                        </p>
                        <p style="margin-top:6px;color:var(--emerald-700);font-weight:600;font-size:14px;">🌱 环保积分：${summary.balance}</p>
                    </div>
                    <div class="profile-actions">
                        <button class="btn btn-outline" onclick="showEditModal()">修改资料</button>
                        <button class="btn btn-primary" onclick="signIn()">签到</button>
                        <button class="btn btn-outline" onclick="shareAchievement()">📤 分享</button>
                    </div>
                </div>

                <!-- 数据统计 -->
                <div class="profile-stats">
                    <div class="stat-box">
                        <div class="num">${summary.balance}</div>
                        <div class="lbl">当前积分</div>
                    </div>
                    <div class="stat-box">
                        <div class="num">${summary.streak}</div>
                        <div class="lbl">连续打卡</div>
                    </div>
                    <div class="stat-box">
                        <div class="num">${summary.todayPoints}/${summary.dailyPointCap}</div>
                        <div class="lbl">今日积分</div>
                    </div>
                </div>

                <!-- 打卡日历 -->
                <section class="panel" style="margin-bottom:24px;">
                    <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">打卡日历（最近 4 周）</h2>
                    <div class="calendar" role="img" aria-label="最近 28 天打卡情况">
                        ${days.map(d => `
                            <div class="cal-cell ${checked.has(d) ? 'checked' : 'unchecked'}" title="${d}">
                                ${Number(d.slice(8))}
                            </div>
                        `).join("")}
                    </div>
                </section>

                <!-- 积分明细 -->
                <section>
                    <div class="section-head">
                        <h2>积分明细</h2>
                    </div>
                    ${entriesHtml}
                </section>
            `;
        }

        function showEditModal() {
            const user = getCurrentUser();
            document.getElementById("editEmail").value = user.email;
            document.getElementById("editStudentId").value = user.studentId || "";
            document.getElementById("editClassName").value = user.className || "";
            const sel = document.getElementById("editCollege");
            sel.innerHTML = '<option value="">请选择学院</option>';
            COLLEGES.forEach(c => {
                const opt = document.createElement("option");
                opt.value = c; opt.textContent = c;
                if (c === user.college) opt.selected = true;
                sel.appendChild(opt);
            });
            document.getElementById("editModal").classList.add("open");
        }

        function hideEditModal() {
            document.getElementById("editModal").classList.remove("open");
        }

        function saveProfile() {
            const email = document.getElementById("editEmail").value.trim();
            const studentId = document.getElementById("editStudentId").value.trim();
            const college = document.getElementById("editCollege").value;
            const className = document.getElementById("editClassName").value.trim();
            const password = document.getElementById("editPassword").value;
            const updates = {};
            if (email) updates.email = email;
            if (studentId) updates.studentId = studentId;
            if (college) updates.college = college;
            if (className) updates.className = className;
            if (password && password.length >= 6) updates.password = password;
            if (password && password.length < 6) { showToast("密码至少需要6个字符"); return; }

            const updated = updateCurrentUser(updates);
            if (updated && updated.error) {
                showToast(updated.error);
                return;
            }
            if (updated) {
                showToast("资料修改成功！", "success");
                hideEditModal();
                renderProfile();
                updateNavAuth();
            } else {
                showToast("修改失败，请重试");
            }
        }

        function signIn() {
            openCheckin('cup');
        }

        // 查看凭证
        function viewProof(cacheKey) {
            const proof = proofCache[cacheKey];
            if (!proof) { showToast("凭证加载失败"); return; }
            const isImage = proof.startsWith("data:image");
            document.getElementById("proofTitle").textContent = "打卡凭证";
            document.getElementById("proofPreview").innerHTML = isImage
                ? `<img src="${proof}" style="max-width:100%;max-height:400px;border-radius:10px;">`
                : `<iframe src="${proof}" style="width:100%;height:400px;border:none;border-radius:10px;"></iframe>`;
            document.getElementById("proofModal").classList.add("open");
        }

        // 分享我的减碳成就
        function shareAchievement() {
            const user = getCurrentUser();
            const summary = getEcoSummary(user.id);
            const trees = summary.trees;
            const text = `🌿 我在校园环保网已累计减碳 ${formatKg(summary.totalCarbonGrams)} kg CO₂，相当于为地球种植了 ${trees} 棵侧柏！连续打卡 ${summary.streak} 天，获得 ${summary.balance} 环保积分。一起来守护绿色校园吧！🌍`;
            shareText(text);
        }

        renderProfile();
    </script>
</body>
</html>
