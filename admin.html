<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核中心 - 校园环保网</title>
    <link rel="stylesheet" href="css/style.css?v=20261026c">
    <style>
        .review-tabs { display: flex; gap: 10px; margin-bottom: 24px; }
        .review-tab { padding: 10px 22px; border: 1.5px solid var(--border); background: #fff; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; transition: var(--transition); }
        .review-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .review-item { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow-sm); display: flex; gap: 16px; align-items: flex-start; }
        .review-proof { width: 120px; height: 120px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; background: var(--emerald-50); display: flex; align-items: center; justify-content: center; }
        .review-body { flex: 1; }
        .review-body h4 { margin-bottom: 6px; }
        .review-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
        .review-actions { display: flex; gap: 8px; }
        .proof-file { font-size: 36px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🌿</span>
                <span>校园环保网</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="activities.html">环保活动</a></li>
                <li><a href="feed.html">环保动态</a></li>
                <li><a href="shop.html">积分商城</a></li>
                <li><a href="admin.html" class="active">审核中心</a></li>
            </ul>
            <div class="nav-user" id="navUser"></div>
        </div>
    </nav>

    <div class="page-banner">
        <h1>🛡️ 管理员审核中心</h1>
        <p>审核活动报名与打卡凭证</p>
    </div>

    <div class="container">
        <div class="review-tabs">
            <button class="review-tab active" onclick="switchTab('signup')">📝 活动报名审核</button>
            <button class="review-tab" onclick="switchTab('checkin')">📸 打卡凭证审核</button>
        </div>

        <div id="signupReview"></div>
        <div id="checkinReview" style="display:none;"></div>
    </div>

    <!-- 凭证预览弹窗 -->
    <div class="modal-overlay" id="proofModal">
        <div class="modal" style="max-width:600px;">
            <h3>凭证预览</h3>
            <div id="proofPreview" style="text-align:center;"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="document.getElementById('proofModal').classList.remove('open')">关闭</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom">© 2024 校园环保网 · 让绿色成为校园最亮丽的底色 🌍</div>
    </footer>

    <script src="js/eco.js?v=20261026c"></script>
    <script src="js/auth.js?v=20261026c"></script>
    <script src="js/main.js?v=20261026c"></script>
    <script>
        // 仅管理员可访问
        if (!isAdmin()) {
            showToast("仅管理员可访问审核中心");
            setTimeout(() => location.href = "index.html", 1200);
        }

        let currentTab = "signup";
        const proofCache = {}; // 凭证缓存，避免内联大字符串

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll(".review-tab").forEach((t, i) => {
                t.classList.toggle("active", (i === 0 && tab === "signup") || (i === 1 && tab === "checkin"));
            });
            document.getElementById("signupReview").style.display = tab === "signup" ? "block" : "none";
            document.getElementById("checkinReview").style.display = tab === "checkin" ? "block" : "none";
            if (tab === "signup") renderSignupReview();
            else renderCheckinReview();
        }

        function renderSignupReview() {
            const signups = getSignups().filter(s => s.status === "pending");
            const el = document.getElementById("signupReview");
            if (signups.length === 0) {
                el.innerHTML = `<div class="empty-state"><p>暂无待审核的报名</p></div>`;
                return;
            }
            el.innerHTML = signups.map(s => `
                <div class="review-item">
                    <div class="review-body">
                        <h4>${s.activityTitle}</h4>
                        <div class="review-meta">
                            👤 ${s.realName || s.username} 
                            · 🎓 ${s.className || '未填写'} 
                            · 🆔 ${s.studentId || '未填写'}
                        </div>
                        <div class="review-meta">${formatDateTime(s.createdAt)}</div>
                        <div class="review-actions">
                            <button class="btn btn-primary" onclick="reviewSignupAction(${s.id}, 'approved')">✓ 通过</button>
                            <button class="btn btn-outline" style="color:#ef4444;border-color:#ef4444;" onclick="reviewSignupAction(${s.id}, 'rejected')">✗ 拒绝</button>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        function reviewSignupAction(id, status) {
            const result = reviewSignup(id, status);
            showToast(result.message, result.success ? "success" : "");
            renderSignupReview();
        }

        function renderCheckinReview() {
            let pending = [];
            try {
                pending = getAllPendingCheckins();
            } catch(e) {
                document.getElementById("checkinReview").innerHTML = `<div class="empty-state"><p>加载失败，请刷新重试</p></div>`;
                return;
            }
            const el = document.getElementById("checkinReview");
            if (pending.length === 0) {
                el.innerHTML = `<div class="empty-state"><p>暂无待审核的打卡凭证</p></div>`;
                return;
            }
            el.innerHTML = pending.map(e => {
                const cacheKey = "p_" + e.id;
                proofCache[cacheKey] = e.proof;
                const isImage = e.proof && e.proof.startsWith("data:image");
                const proofHtml = isImage
                    ? `<img src="${e.proof}" class="review-proof" onclick="showProof('${cacheKey}', true)" style="cursor:pointer;">`
                    : `<div class="review-proof" onclick="showProof('${cacheKey}', false)" style="cursor:pointer;"><span class="proof-file">📄</span></div>`;
                return `
                <div class="review-item">
                    ${proofHtml}
                    <div class="review-body">
                        <h4>${e.title}</h4>
                        <div class="review-meta">👤 ${e.username} · ${e.college || ''} · ${formatDateTime(e.createdAt)}</div>
                        <div class="review-meta">${e.detail} · 待发放 ${e.points} 积分 · 减碳 ${e.carbonGrams}g</div>
                        <div class="review-meta" style="color:var(--text-muted);font-size:12px;">📎 ${e.proofName}</div>
                        <div class="review-actions">
                            <button class="btn btn-primary" onclick="reviewCheckinAction(${e.userId}, ${e.id}, 'approved')">✓ 通过</button>
                            <button class="btn btn-outline" style="color:#ef4444;border-color:#ef4444;" onclick="reviewCheckinAction(${e.userId}, ${e.id}, 'rejected')">✗ 拒绝</button>
                        </div>
                    </div>
                </div>
                `;
            }).join("");
        }

        function reviewCheckinAction(userId, entryId, status) {
            const result = reviewCheckin(userId, entryId, status);
            showToast(result.message, result.success ? "success" : "");
            renderCheckinReview();
        }

        function showProof(cacheKey, isImage) {
            const proof = proofCache[cacheKey];
            if (!proof) { showToast("凭证加载失败"); return; }
            const preview = document.getElementById("proofPreview");
            preview.innerHTML = isImage
                ? `<img src="${proof}" style="max-width:100%;max-height:400px;border-radius:10px;">`
                : `<iframe src="${proof}" style="width:100%;height:400px;border:none;border-radius:10px;"></iframe>`;
            document.getElementById("proofModal").classList.add("open");
        }

        // 初始渲染
        renderSignupReview();
    </script>
</body>
</html>
