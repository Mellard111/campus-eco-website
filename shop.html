<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分商城 - 校园环保网</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🌿</span>
                <span>校园环保网</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="activities.html">环保活动</a></li>
                <li><a href="shop.html" class="active">积分商城</a></li>
                <li><a href="carbon.html">碳足迹</a></li>
            </ul>
            <div class="nav-user" id="navUser"></div>
        </div>
    </nav>

    <div class="container">
        <div class="section-head" style="margin-top:0;">
            <div>
                <h1 style="font-size:24px;font-weight:700;">积分商城</h1>
                <p style="font-size:14px;color:var(--text-muted);margin-top:4px;">每月最多兑换 3 件，领取码 7 天内有效</p>
            </div>
            <div style="background:var(--emerald-50);padding:10px 18px;border-radius:12px;text-align:center;">
                <div style="font-size:22px;font-weight:700;color:var(--emerald-700);" id="myPoints">--</div>
                <div style="font-size:12px;color:var(--emerald-800);">我的积分</div>
            </div>
        </div>

        <div class="gift-grid" id="shopGrid"></div>
    </div>

    <!-- 兑换弹窗 -->
    <div class="modal-overlay" id="redeemModal">
        <div class="modal">
            <h3>确认兑换</h3>
            <div id="redeemBody" style="text-align:center;padding:10px 0;"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeRedeem()">取消</button>
                <button class="btn btn-primary" onclick="confirmRedeem()">确认兑换</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom">© 2024 校园环保网 · 让绿色成为校园最亮丽的底色 🌍</div>
    </footer>

    <script src="js/eco.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let currentGift = null;

        function renderShop() {
            const user = getCurrentUser();
            const pointsEl = document.getElementById("myPoints");

            if (user) {
                const summary = getEcoSummary(user.id);
                pointsEl.textContent = summary.balance;
            } else {
                pointsEl.textContent = "--";
            }

            const grid = document.getElementById("shopGrid");
            grid.innerHTML = GIFTS.map(g => `
                <div class="gift-card" onclick="openRedeem('${g.id}')">
                    <div class="gift-img">${g.emoji}</div>
                    <div class="gift-body">
                        <h4>${g.name}</h4>
                        <div class="points">${g.points} 积分</div>
                        <div class="stock">库存 ${g.stock}</div>
                    </div>
                </div>
            `).join("");
        }

        function openRedeem(giftId) {
            const user = getCurrentUser();
            if (!user) {
                showToast("请先登录");
                setTimeout(() => location.href = "login.html", 800);
                return;
            }
            const gift = GIFTS.find(g => g.id === giftId);
            if (!gift) return;
            currentGift = gift;

            const summary = getEcoSummary(user.id);
            document.getElementById("redeemBody").innerHTML = `
                <div style="font-size:48px;margin-bottom:10px;">${gift.emoji}</div>
                <h4 style="font-size:16px;margin-bottom:6px;">${gift.name}</h4>
                <p style="color:var(--text-muted);font-size:14px;">需 ${gift.points} 积分 · 你有 ${summary.balance} 积分</p>
                <p style="color:var(--text-muted);font-size:12px;margin-top:6px;">本月已兑换 ${summary.redeemCount}/${summary.monthlyRedeemLimit} 件</p>
            `;
            document.getElementById("redeemModal").classList.add("open");
        }

        function closeRedeem() {
            document.getElementById("redeemModal").classList.remove("open");
            currentGift = null;
        }

        function confirmRedeem() {
            if (!currentGift) return;
            const user = getCurrentUser();
            const result = redeemGift(user.id, currentGift.id);
            if (result.success) {
                showToast(result.message, "success");
                closeRedeem();
                renderShop();
            } else {
                showToast(result.message);
            }
        }

        renderShop();
    </script>
    <script src="js/main.js"></script>
</body>
</html>
